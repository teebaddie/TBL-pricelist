        return (d.fields && d.fields.value) ? d.fields.value.stringValue : null;
      });
    })
    .catch(function() { return null; });
}

function fsSet(value) {
  return fetch(FS_URL + "?key=" + FS_KEY + "&updateMask.fieldPaths=value", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },

function fmt(n) { return "\u20a6" + Math.max(0, Number(n)).toLocaleString("en-NG", { minimumFractionDigits: 2 }); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function sortedAlpha(data) {
  var cats = Object.keys(data).sort(function(a,b){ return a.localeCompare(b); });
  var out = {};
  cats.forEach(function(cat) {
    out[cat] = data[cat].slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  });
  return out;
}

function buildFromStored(stored) {
  if (!stored) return sortedAlpha(clone(DEFAULT_SERVICES));
  var out = {};
  var order = stored.categories || Object.keys(DEFAULT_SERVICES);
  order.forEach(function(cat) {
    var s = stored.services && stored.services[cat];
    var defs = DEFAULT_SERVICES[cat] || [];
    if (s && Array.isArray(s)) {
      out[cat] = s.map(function(si) {
        var def = defs.find(function(d){ return d.name === si.name; });
        return def ? Object.assign({}, def, { price: Number(si.price) || 0 }) : { name: si.name, price: Number(si.price) || 0 };
      });
    } else { out[cat] = clone(defs); }
  });
  Object.keys(DEFAULT_SERVICES).forEach(function(cat) {
    if (!out[cat]) out[cat] = clone(DEFAULT_SERVICES[cat]);
  });
  return sortedAlpha(out);
}

function serialize(catOrder, prices) {
  var svcs = {};
  catOrder.forEach(function(cat) {
    svcs[cat] = (prices[cat] || []).map(function(item) { return { name: item.name, price: item.price }; });
  });
  return JSON.stringify({ categories: catOrder, services: svcs });
}

      if (val) {
        try { localStorage.setItem(LSKEY, val); } catch(e) {}
        try { setServices(buildFromStored(JSON.parse(val))); } catch(e) {}
      } else if (!local && !seededRef.current) {

        var payload = serialize(Object.keys(fresh), fresh);
        try { localStorage.setItem(LSKEY, payload); } catch(e) {}
        fsSet(payload).catch(function(){});
        setServices(fresh);
      }

    });

  // ── Billing (discount BEFORE VAT, matching AestheticsPro) ──
  var subtotal = selItems.reduce(function(s,x){ return s+x.service.price*x.qty; }, 0);
  var hasNonConsult   = selItems.some(function(x){ return !x.service.isConsultation; });
  var hasAutoDiscount = selItems.some(function(x){ return x.service.autoDiscount; });
  var consultDisc = (!suppress && hasNonConsult)
    ? selItems.reduce(function(s,x){ return s+(x.service.autoDiscount||0)*x.qty; }, 0) : 0;
  var manualDisc = discounts.reduce(function(s,d) {
    var v=parseFloat(d.value.replace(/[^0-9.]/g,""))||0;
    return s+(d.type==="percent"?Math.round((v/100)*subtotal):v);
  }, 0);
  var totalDisc = consultDisc + manualDisc;
  var discountedSubtotal = Math.max(0, subtotal - totalDisc);
  var vat = Math.round(discountedSubtotal * VAT_RATE);
  var finalTotal = discountedSubtotal + vat;

  function sortAlpha() {

  function saveBulkEdit() {
    var cat=bulkEditCat;

  function handleSave() {
    if (!editData) return;
    setSaveStatus("saving");
    var final={};
    editData.catOrder.forEach(function(cat) {
      final[cat]=(editData.prices[cat]||[]).map(function(item){ return Object.assign({},item,{price:parseInt(String(item.price).replace(/[^0-9]/g,""),10)||0}); });
    });
    var payload=serialize(editData.catOrder,final);
    try { localStorage.setItem(LSKEY,payload); } catch(e) {}
    setServices(final);
    setEditData({catOrder:editData.catOrder.slice(),prices:clone(final)});
    fsSet(payload).then(function() {
      setSaveStatus("saved");
      setTimeout(function(){setSaveStatus("");},4000);
    }).catch(function(e) {
      setSaveStatus("saved"); // saved locally at minimum
      console.warn("Firestore sync failed:",e.message);
      setTimeout(function(){setSaveStatus("");},4000);
    });
  }

  function handleReset() {
    var fresh=sortedAlpha(clone(DEFAULT_SERVICES));

    setTimeout(function(){setSaveStatus("");},4000);
  }

                    </div>
                  </div>
                  {!searching&&(
                    <div style={{display:"flex",alignItems:"center",gap:4,padding:"0 10px",borderLeft:"1px solid #1a1a1a"}}>
                      <button onClick={function(e){e.stopPropagation();openBulkEdit(cat);}} style={{fontSize:11,color:PINK,background:"transparent",border:"1px solid rgba(243,194,215,0.2)",borderRadius:5,padding:"3px 7px",cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Edit All</button>
                      <button className="db" onClick={function(e){e.stopPropagation();setDelCatTarget(cat);}}
                        style={{width:26,height:26,borderRadius:5,border:"1px solid #2a2a2a",background:"transparent",color:"#555",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit"}}>🗑</button>
                    </div>
                  )}
                </div>
                {isOpen&&(
                  <div style={{borderTop:"1px solid #222"}}>
                    {filtered.length===0&&!isAdding&&<div style={{padding:16,textAlign:"center",fontSize:12,color:"#444"}}>No services — add one below</div>}
                    {filtered.map(function(item) {
                      return (
                        <div key={cat+"-"+item.i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:"1px solid #181818"}}>
                          <div style={{flex:1,marginRight:12}}>
                            <div style={{fontSize:13,color:"#ccc"}}>{item.s.name}</div>
                            {item.s.autoDiscount&&<div style={{fontSize:10,color:"#7a9e7a",marginTop:1}}>Includes ₦5,000 auto-discount</div>}
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                            <span style={{color:PINK,fontSize:13}}>₦</span>
                            <input className="fi" type="number" min="0" value={item.s.price} onChange={function(e){setPrice(cat,item.i,e.target.value);}}
                              style={{width:120,padding:"8px 10px",background:"#000",border:"1px solid #2a2a2a",borderRadius:8,color:"#fff",fontSize:13,fontFamily:"inherit",textAlign:"right"}}/>
                            <button className="db" onClick={function(){deleteSvc(cat,item.i);}}
                              style={{width:28,height:28,borderRadius:6,border:"1px solid #2a2a2a",background:"transparent",color:"#555",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit"}}>🗑</button>
                          </div>
                        </div>
                      );
                    })}
                    {!searching&&(isAdding?(
                      <div style={{padding:"14px 16px",borderTop:"1px solid #1a1a1a",background:"rgba(243,194,215,0.03)"}}>
                        <div style={{fontSize:11,color:PINK,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>New Service</div>
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          <input autoFocus className="fi" placeholder="Service name" value={addForm.name} onChange={function(e){setAddForm(function(p){return Object.assign({},p,{name:e.target.value});});}}
                            style={{flex:2,minWidth:140,padding:"9px 12px",background:"#000",border:"1px solid #2a2a2a",borderRadius:8,color:"#fff",fontSize:13,fontFamily:"inherit"}}/>
                          <div style={{position:"relative",flex:1,minWidth:110}}>
                            <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:PINK,fontSize:12}}>₦</span>
                            <input className="fi" type="number" min="0" placeholder="Price" value={addForm.price} onChange={function(e){setAddForm(function(p){return Object.assign({},p,{price:e.target.value});});}} onKeyDown={function(e){if(e.key==="Enter")addSvc(cat);}}
                              style={{width:"100%",padding:"9px 10px 9px 24px",background:"#000",border:"1px solid #2a2a2a",borderRadius:8,color:"#fff",fontSize:13,fontFamily:"inherit"}}/>
                          </div>
                          <button onClick={function(){addSvc(cat);}} style={{padding:"9px 18px",background:PINK,border:"none",borderRadius:8,color:"#000",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>Add</button>
                          <button onClick={function(){setAddForm(null);}} style={{padding:"9px 13px",background:"transparent",border:"1px solid #333",borderRadius:8,color:"#666",fontFamily:"inherit",fontSize:12,cursor:"pointer",flexShrink:0}}>Cancel</button>
                        </div>
                      </div>
                    ):(
                      <button onClick={function(){setAddForm({cat:cat,name:"",price:""});setEditOpenCat(cat);}}
                        style={{width:"100%",padding:11,background:"transparent",border:"none",borderTop:"1px solid #1a1a1a",color:PINK,fontFamily:"inherit",fontSize:12,cursor:"pointer"}}
                        onMouseEnter={function(e){e.currentTarget.style.background="rgba(243,194,215,0.04)";}}
                        onMouseLeave={function(e){e.currentTarget.style.background="transparent";}}>
                        + Add Service to {cat}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#000",borderTop:"1px solid rgba(192,57,43,0.25)",padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",zIndex:100}}>
            <div style={{display:"flex",gap:8}}>
              <button onClick={function(){setShowAddCat(true);}} style={{padding:"8px 14px",background:"rgba(243,194,215,0.08)",border:"1px solid rgba(243,194,215,0.25)",borderRadius:16,color:PINK,fontFamily:"inherit",fontSize:11,cursor:"pointer"}}>+ Category</button>
              <button onClick={openBulkAdd} style={{padding:"8px 14px",background:"rgba(243,194,215,0.08)",border:"1px solid rgba(243,194,215,0.25)",borderRadius:16,color:PINK,fontFamily:"inherit",fontSize:11,cursor:"pointer"}}>Bulk Add</button>
            </div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              {saveStatus==="saving"&&<span style={{fontSize:12,color:"#888"}}>Saving…</span>}
              {saveStatus==="saved"&&<span style={{fontSize:12,color:"#7a9e7a"}}>✓ Saved</span>}
              <button onClick={handleSave} style={{padding:"9px 22px",background:PINK,border:"none",borderRadius:20,color:"#000",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>Save All Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* STICKY BILL BAR */}
      {selItems.length>0&&activeTab==="select"&&(
        <div onClick={function(){setActiveTab("checkout");}} style={{position:"fixed",bottom:0,left:0,right:0,background:"#000",borderTop:"1px solid rgba(243,194,215,0.3)",padding:"13px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",zIndex:100}}>
          <div>
            <div style={{fontSize:11,color:"#555",letterSpacing:1}}>{selItems.length} service{selItems.length!==1?"s":""} selected</div>
            <div style={{fontSize:13,color:PINK,marginTop:2}}>
              {fmt(subtotal)}{totalDisc>0?" − "+fmt(totalDisc):""} + VAT = <strong>{fmt(finalTotal)}</strong>
            </div>
          </div>
          <div style={{background:PINK,color:"#000",padding:"8px 18px",borderRadius:20,fontSize:12,fontWeight:700,flexShrink:0}}>VIEW BILL →</div>
        </div>
      )}

      {showTop&&(
        <button className="bt" onClick={function(){window.scrollTo({top:0,behavior:"smooth"});}}
          style={{position:"fixed",bottom:selItems.length>0&&activeTab==="select"?78:22,right:18,zIndex:200,background:"rgba(0,0,0,0.85)",border:"1px solid "+PINK,color:PINK,borderRadius:"50%",width:40,height:40,fontSize:17,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit"}}>↑</button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>
</body>
</html>
