    const r = await fetch(FS_URL + "?key=" + FS_KEY);

const clone = o => JSON.parse(JSON.stringify(o));

function sortedAlpha(data) {
  const cats = Object.keys(data).sort((a, b) => a.localeCompare(b));
  const out = {};
  cats.forEach(cat => { out[cat] = [...data[cat]].sort((a, b) => a.name.localeCompare(b.name)); });
  return out;
}

function buildFromStored(stored) {
  if (!stored) return sortedAlpha(clone(DEFAULT_SERVICES));
  const out = {};
  const order = stored.categories || Object.keys(DEFAULT_SERVICES);
  // Load stored categories
  order.forEach(cat => {
    const s = stored.services && stored.services[cat];
    const defs = DEFAULT_SERVICES[cat] || [];
    if (s && Array.isArray(s)) {
      out[cat] = s.map(si => {
        const def = defs.find(d => d.name === si.name);
        if (def) {
          const merged = { ...def };
          if (def.perUnit) {
            // Per-unit: the rate lives in unitPrice. Use a stored override if the admin edited it.
            merged.unitPrice = (si.unitPrice != null ? Number(si.unitPrice) : def.unitPrice) || 0;
            if (si.minUnits != null) merged.minUnits = Number(si.minUnits) || def.minUnits;
            merged.price = merged.unitPrice;
          } else {
            merged.price = Number(si.price) || 0;
          }
          return merged;
        }
        if (si.perUnit) {
          const up = Number(si.unitPrice) || Number(si.price) || 0;
          return { name: si.name, perUnit: true, unitPrice: up, minUnits: Number(si.minUnits) || 1, price: up };
        }
        return { name: si.name, price: Number(si.price) || 0 };
      });
      // Merge in any new default items (price-list additions) not present in stored data
      defs.forEach(d => { if (!out[cat].some(x => x.name === d.name)) out[cat].push(clone(d)); });
    } else { out[cat] = clone(defs); }
  });
  // Merge in any new default categories not yet in storage
  Object.keys(DEFAULT_SERVICES).forEach(cat => {
    if (!out[cat]) out[cat] = clone(DEFAULT_SERVICES[cat]);
  });
  return sortedAlpha(out);
}

function serialize(catOrder, prices) {
  const svcs = {};
  catOrder.forEach(cat => {
    svcs[cat] = (prices[cat] || []).map(item => {
      const base = { name: item.name, price: item.price };
      if (item.perUnit) { base.perUnit = true; base.unitPrice = item.unitPrice; base.minUnits = item.minUnits; }
      return base;
    });
  });
  return JSON.stringify({ categories: catOrder, services: svcs });
}

                  </button>
                </div>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 16, borderTop: "1px solid rgba(243,194,215,0.2)" }}>
                  <div>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 18, color: PINK }}>Amount Due</div>
                    {totalDisc > 0 && <div style={{ fontSize: 11, color: "#7a9e7a", marginTop: 2 }}>Saved {fmt(totalDisc)}</div>}
                  </div>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 26, color: PINK, fontWeight: 700 }}>{fmt(finalTotal)}</div>
                </div>
              </div>

              {bundleSuggestItems.length > 0 && (
                <div style={{ background: "linear-gradient(180deg, rgba(243,194,215,0.06), #0d0d0d)", borderRadius: 12, border: "1px solid rgba(243,194,215,0.28)", padding: 18, marginTop: 14 }}>
                  <div style={{ fontSize: 12, color: PINK, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 4, fontWeight: 700 }}>💡 Suggested Bundles & Cross-Sells</div>
                  <div style={{ fontSize: 10.5, color: "#888", marginBottom: 14 }}>Complementary services for each item in the cart. If the client says yes, tap <span style={{ color: "#8aba8a" }}>+ Add</span> to drop it into the bill with the recommended sessions.</div>
                  {bundleSuggestItems.map((it, ii) => (
                    <div key={it.name} style={{ marginBottom: ii === bundleSuggestItems.length - 1 ? 0 : 12, padding: "12px 14px", background: "rgba(243,194,215,0.045)", border: "1px solid rgba(243,194,215,0.18)", borderRadius: 10 }}>
                      <div style={{ fontSize: 12.5, color: "#fff", fontWeight: 700, marginBottom: 10, paddingBottom: 8, borderBottom: "1px solid rgba(243,194,215,0.18)" }}>Because they're getting <span style={{ color: PINK }}>{it.name}</span>, pair with:</div>
                      {it.sug.map((b, bi) => {
                        const ai = b.add ? findSvcIdx(b.add.cat, b.add.name) : -1;
                        const inCart = ai >= 0 && !!selected[`${b.add.cat}|||${ai}`];
                        return (
                          <div key={bi} style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: bi === it.sug.length - 1 ? 0 : 11, paddingLeft: 2 }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: 12.5, color: "#f0d8e4", fontWeight: 600 }}>→ {b.s} <span style={{ color: "#7a9e7a", fontWeight: 400 }}>· {b.n}</span></div>
                              <div style={{ fontSize: 11, color: "#999", lineHeight: 1.5, marginTop: 2 }}>{b.why}</div>
                            </div>
                            {ai >= 0 && (
                              inCart
                                ? <span style={{ flexShrink: 0, fontSize: 10.5, color: "#7a9e7a", fontWeight: 600, whiteSpace: "nowrap", padding: "5px 8px" }}>✓ In cart</span>
                                : <button onClick={() => addSuggestion(b.add.cat, b.add.name, b.add.qty)} style={{ flexShrink: 0, fontSize: 11, color: "#8aba8a", background: "rgba(138,186,138,0.1)", border: "1px solid rgba(138,186,138,0.35)", borderRadius: 6, padding: "5px 10px", cursor: "pointer", whiteSpace: "nowrap", fontWeight: 600 }}>+ Add {b.add.qty}</button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              )}

              <div style={{ background: "#0d0d0d", borderRadius: 12, border: "1px solid rgba(243,194,215,0.18)", padding: 18, marginTop: 14 }}>
                <div style={{ fontSize: 11, color: PINK, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12, fontWeight: 600 }}>Discount Rules · Front Desk Reference</div>
                <div style={{ fontSize: 12.5, color: "#bbb", lineHeight: 1.75 }}>
                  <div style={{ marginBottom: 8 }}><strong style={{ color: "#ddd" }}>How to count:</strong> add up every session / unit in the cart (a 4-session course counts as 4). Services over ₦20,000 discount from 4 sessions. Services <strong>₦20,000 or under discount only at 8+ sessions</strong>.</div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid #1c1c1c" }}><span>1–3 sessions <span style={{ color: "#777" }}>(with a consultation in the cart)</span></span><span style={{ color: "#8aba8a", fontWeight: 600 }}>₦5,000 off</span></div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid #1c1c1c" }}><span>4–7 sessions</span><span style={{ color: "#8aba8a", fontWeight: 600 }}>12% today · 6% later</span></div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid #1c1c1c" }}><span>8–11 sessions</span><span style={{ color: "#8aba8a", fontWeight: 600 }}>14% today · 8% later</span></div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid #1c1c1c" }}><span>12+ sessions</span><span style={{ color: "#8aba8a", fontWeight: 600 }}>16% today · 10% later</span></div>
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid #1c1c1c" }}><span>Package bundles &amp; weight-loss programs</span><span style={{ color: "#8aba8a", fontWeight: 600 }}>12% today · 6% later</span></div>
                  <div style={{ marginTop: 8, color: "#888" }}><strong style={{ color: "#aaa" }}>Today</strong> = booked at the consultation visit (needs a Consultation in the cart). <strong style={{ color: "#aaa" }}>Later</strong> = returning / follow-up. Without a Consultation in the cart the calculator uses Later rates automatically.</div>
                  <div style={{ marginTop: 10, padding: "10px 12px", background: "rgba(243,194,215,0.05)", border: "1px solid rgba(243,194,215,0.15)", borderRadius: 8, color: "#ccc" }}>
                    <strong style={{ color: PINK }}>Example:</strong> Client at consultation buys 4 laser sessions at ₦50,000 = ₦200,000. Today → 12% = ₦24,000 off. ₦176,000 + 7.5% VAT (₦13,200) = <strong style={{ color: "#fff" }}>₦189,200</strong>.
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
      )}

      {/* ══ ADMIN TAB ══ */}
      {activeTab === "admin" && isAdmin && editData && (
        <div style={{ maxWidth: 780, margin: "0 auto", padding: "0 16px 90px" }}>
          <div style={{ position: "sticky", top: H, zIndex: 90, background: "#000", paddingTop: 13, paddingBottom: 11 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 11, gap: 8, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontSize: 13, color: "#fff", fontWeight: 600 }}>Edit Services</div>
                <div style={{ fontSize: 10, color: "#555", marginTop: 2 }}>{editData.catOrder.length} categories · {editData.catOrder.reduce((s, c) => s + (editData.prices[c]?.length || 0), 0)} services</div>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                {saveStatus === "saving" && <span style={{ fontSize: 12, color: "#888" }}>Saving…</span>}
                {saveStatus === "saved" && <span style={{ fontSize: 12, color: "#7a9e7a" }}>✓ Saved</span>}
                {saveStatus === "error" && <span style={{ fontSize: 12, color: "#c0392b" }}>✗ Failed</span>}
                <button onClick={sortAlpha} style={{ ...b, padding: "7px 11px", background: "transparent", border: "1px solid #333", borderRadius: 7, color: "#888", fontSize: 11 }}>Sort A–Z</button>
                <button onClick={() => setShowAddCat(true)} style={{ ...b, padding: "7px 11px", background: "rgba(243,194,215,0.08)", border: "1px solid rgba(243,194,215,0.3)", borderRadius: 7, color: PINK, fontSize: 11 }}>+ Category</button>
                <button onClick={openBulkAdd} style={{ ...b, padding: "7px 11px", background: "rgba(243,194,215,0.08)", border: "1px solid rgba(243,194,215,0.3)", borderRadius: 7, color: PINK, fontSize: 11 }}>Bulk Add</button>
                <button onClick={() => openBulkEdit(editData.catOrder[0])} style={{ ...b, padding: "7px 11px", background: "rgba(243,194,215,0.08)", border: "1px solid rgba(243,194,215,0.3)", borderRadius: 7, color: PINK, fontSize: 11 }}>Bulk Edit</button>
                <button onClick={() => setShowReset(true)} style={{ ...b, padding: "7px 11px", background: "rgba(192,57,43,0.1)", border: "1px solid rgba(192,57,43,0.3)", borderRadius: 7, color: "#e07070", fontSize: 11 }}>Reset</button>
                <button onClick={handleSave} style={{ ...b, padding: "7px 16px", background: PINK, border: "none", borderRadius: 7, color: "#000", fontSize: 12, fontWeight: 700 }}>Save All</button>
              </div>
            </div>
            <div style={{ position: "relative" }}>
              <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: "#555" }}>🔍</span>
              <input value={adminSearch} onChange={e => setAdminSearch(e.target.value)} placeholder="Search services to edit…" className="fi"
                style={{ width: "100%", padding: "11px 40px 11px 42px", background: "#111", border: "1px solid #2a2a2a", borderRadius: 10, color: "#fff", fontSize: 14, fontFamily: "inherit" }} />
              {adminSearch && <button onClick={() => setAdminSearch("")} style={{ ...b, position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#666", fontSize: 20 }}>×</button>}
            </div>
          </div>

          {editData.catOrder.map((cat, catIdx) => {
            const items = editData.prices[cat] || [];
            const searching = adminSearch.trim() !== "";
            const filtered = searching
              ? items.map((s, i) => ({ s, i })).filter(({ s }) => s.name.toLowerCase().includes(adminSearch.toLowerCase()))
              : items.map((s, i) => ({ s, i }));
            if (searching && filtered.length === 0) return null;
            const isOpen = searching || editOpenCat === cat;
            const isAdding = addForm?.cat === cat;
            return (
              <div key={cat} style={{ marginBottom: 7, border: "1px solid #222", borderRadius: 10, overflow: "hidden" }}>
                <div style={{ display: "flex", alignItems: "stretch", background: isOpen ? "rgba(243,194,215,0.06)" : "#111" }}>
                  {!searching && (
                    <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 6px 0 8px", gap: 3, borderRight: "1px solid #1a1a1a" }}>
                      <button className="mb" onClick={() => moveCat(catIdx, -1)} disabled={catIdx === 0}
                        style={{ ...b, width: 22, height: 18, border: "1px solid #2a2a2a", background: "transparent", color: catIdx === 0 ? "#222" : "#666", cursor: catIdx === 0 ? "default" : "pointer", borderRadius: 4, fontSize: 9 }}>▲</button>
                      <button className="mb" onClick={() => moveCat(catIdx, 1)} disabled={catIdx === editData.catOrder.length - 1}
                        style={{ ...b, width: 22, height: 18, border: "1px solid #2a2a2a", background: "transparent", color: catIdx === editData.catOrder.length - 1 ? "#222" : "#666", cursor: catIdx === editData.catOrder.length - 1 ? "default" : "pointer", borderRadius: 4, fontSize: 9 }}>▼</button>
                    </div>
                  )}
                  <div onClick={() => !searching && setEditOpenCat(p => p === cat ? null : cat)} className={searching ? "" : "ch"}
                    style={{ flex: 1, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px", cursor: searching ? "default" : "pointer" }}>
                    <span style={{ fontSize: 13, color: "#ccc" }}>{cat}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 11, color: "#555" }}>{items.length} item{items.length !== 1 ? "s" : ""}</span>
                      {!searching && <span style={{ color: "#555", fontSize: 17, display: "inline-block", transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>⌄</span>}
                    </div>
                  </div>
                  {!searching && (
                    <div style={{ display: "flex", alignItems: "center", gap: 4, padding: "0 10px", borderLeft: "1px solid #1a1a1a" }}>
                      <button onClick={e => { e.stopPropagation(); openBulkEdit(cat); }}
                        style={{ ...b, fontSize: 11, color: PINK, background: "transparent", border: "1px solid rgba(243,194,215,0.2)", borderRadius: 5, padding: "3px 7px", whiteSpace: "nowrap" }}>Edit All</button>
                      <button className="db" onClick={e => { e.stopPropagation(); setDeleteCatTarget(cat); }}
                        style={{ ...b, width: 26, height: 26, borderRadius: 5, border: "1px solid #2a2a2a", background: "transparent", color: "#555", fontSize: 13 }}>🗑</button>
                    </div>
                  )}
                </div>

                {isOpen && (
                  <div style={{ borderTop: "1px solid #222" }}>
                    {filtered.length === 0 && !isAdding && <div style={{ padding: 16, textAlign: "center", fontSize: 12, color: "#444" }}>No services — add one below</div>}
                    {filtered.map(({ s: svc, i: idx }) => (
                      <div key={`${cat}-${idx}`} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 16px", borderBottom: "1px solid #181818" }}>
                        <div style={{ flex: 1, marginRight: 12 }}>
                          <div style={{ fontSize: 13, color: "#ccc" }}>{svc.name}</div>
                          {svc.autoDiscount && <div style={{ fontSize: 10, color: "#7a9e7a", marginTop: 1 }}>Includes ₦5,000 auto-discount</div>}
                          {svc.perUnit && <div style={{ fontSize: 10, color: "#7a9e7a", marginTop: 1 }}>Per unit · min {svc.minUnits} units</div>}
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                          <span style={{ color: PINK, fontSize: 13 }}>₦</span>
                          <input className="fi" type="number" min="0" value={svc.perUnit ? svc.unitPrice : svc.price} onChange={e => setPrice(cat, idx, e.target.value)}
                            style={{ width: 120, padding: "8px 10px", background: "#000", border: "1px solid #2a2a2a", borderRadius: 8, color: "#fff", fontSize: 13, fontFamily: "inherit", textAlign: "right" }} />
                          {svc.perUnit && <span style={{ color: "#777", fontSize: 11 }}>/unit</span>}
                          <button className="db" onClick={() => deleteSvc(cat, idx)}
                            style={{ ...b, width: 28, height: 28, borderRadius: 6, border: "1px solid #2a2a2a", background: "transparent", color: "#555", fontSize: 13 }}>🗑</button>
                        </div>
                      </div>
                    ))}
                    {!searching && (isAdding ? (
                      <div style={{ padding: "14px 16px", borderTop: "1px solid #1a1a1a", background: "rgba(243,194,215,0.03)" }}>
                        <div style={{ fontSize: 11, color: PINK, letterSpacing: 1, textTransform: "uppercase", marginBottom: 10 }}>New Service</div>
                        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                          <input autoFocus className="fi" placeholder="Service name" value={addForm.name} onChange={e => setAddForm(p => ({ ...p, name: e.target.value }))}
                            style={{ flex: 2, minWidth: 140, padding: "9px 12px", background: "#000", border: "1px solid #2a2a2a", borderRadius: 8, color: "#fff", fontSize: 13, fontFamily: "inherit" }} />
                          <div style={{ position: "relative", flex: 1, minWidth: 110 }}>
                            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: PINK, fontSize: 12 }}>₦</span>
                            <input className="fi" type="number" min="0" placeholder="Price" value={addForm.price} onChange={e => setAddForm(p => ({ ...p, price: e.target.value }))} onKeyDown={e => e.key === "Enter" && addSvc(cat)}
                              style={{ width: "100%", padding: "9px 10px 9px 24px", background: "#000", border: "1px solid #2a2a2a", borderRadius: 8, color: "#fff", fontSize: 13, fontFamily: "inherit" }} />
                          </div>
                          <button onClick={() => addSvc(cat)} style={{ ...b, padding: "9px 18px", background: PINK, border: "none", borderRadius: 8, color: "#000", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>Add</button>
                          <button onClick={() => setAddForm(null)} style={{ ...b, padding: "9px 13px", background: "transparent", border: "1px solid #333", borderRadius: 8, color: "#666", fontSize: 12, flexShrink: 0 }}>Cancel</button>
                        </div>
                      </div>
                    ) : (
                      <button onClick={() => { setAddForm({ cat, name: "", price: "" }); setEditOpenCat(cat); }}
                        style={{ ...b, width: "100%", padding: 11, background: "transparent", border: "none", borderTop: "1px solid #1a1a1a", color: PINK, fontFamily: "inherit", fontSize: 12, cursor: "pointer" }}
                        onMouseEnter={e => e.currentTarget.style.background = "rgba(243,194,215,0.04)"}
                        onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                        + Add Service to {cat}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#000", borderTop: "1px solid rgba(192,57,43,0.25)", padding: "12px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 100 }}>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setShowAddCat(true)} style={{ ...b, padding: "8px 14px", background: "rgba(243,194,215,0.08)", border: "1px solid rgba(243,194,215,0.25)", borderRadius: 16, color: PINK, fontFamily: "inherit", fontSize: 11 }}>+ Category</button>
              <button onClick={openBulkAdd} style={{ ...b, padding: "8px 14px", background: "rgba(243,194,215,0.08)", border: "1px solid rgba(243,194,215,0.25)", borderRadius: 16, color: PINK, fontFamily: "inherit", fontSize: 11 }}>Bulk Add</button>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              {saveStatus === "saved" && <span style={{ fontSize: 12, color: "#7a9e7a" }}>✓ Saved</span>}
              <button onClick={handleSave} style={{ ...b, padding: "9px 22px", background: PINK, border: "none", borderRadius: 20, color: "#000", fontSize: 12, fontWeight: 700 }}>Save All Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* STICKY BILL BAR */}
      {selItems.length > 0 && activeTab === "select" && (
        <div onClick={() => setActiveTab("checkout")} style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#000", borderTop: "1px solid rgba(243,194,215,0.3)", padding: "13px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", zIndex: 100 }}>
          <div>
            <div style={{ fontSize: 11, color: "#555", letterSpacing: 1 }}>{selItems.length} service{selItems.length !== 1 ? "s" : ""} selected</div>
            <div style={{ fontSize: 13, color: PINK, marginTop: 2 }}>
              {fmt(subtotal)}{totalDisc > 0 ? ` − ${fmt(totalDisc)}` : ""} + VAT = <strong>{fmt(finalTotal)}</strong>
            </div>
          </div>
          <div style={{ background: PINK, color: "#000", padding: "8px 18px", borderRadius: 20, fontSize: 12, fontWeight: 700, flexShrink: 0 }}>VIEW BILL →</div>
        </div>
      )}

      {showBackTop && (
        <button className="bt" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
          style={{ ...b, position: "fixed", bottom: selItems.length > 0 && activeTab === "select" ? 78 : 22, right: 18, zIndex: 200, background: "rgba(0,0,0,0.85)", border: `1px solid ${PINK}`, color: PINK, borderRadius: "50%", width: 40, height: 40, fontSize: 17 }}>↑</button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
